name: E2E

on:
  push:
  pull_request:

jobs:
  local-fake-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dashboard test dependency
        run: python3 -m pip install Pillow

      - run: npm ci --omit=optional

      - name: Assert native Windows packages are absent
        run: |
          for package in node_modules/koffi node_modules/node-pty node_modules/@xterm/* node_modules/@koromix/*; do
            if [ -e "$package" ]; then
              echo "$package is installed; Linux and macOS must not have it" >&2
              exit 1
            fi
          done

      - name: Verify host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh python3 jq
          command -v zsh
          command -v python3
          command -v jq

      - run: npm test

  windows-e2e:
    name: windows-e2e (Node ${{ matrix.node }}, shard ${{ matrix.shard }})
    runs-on: windows-latest
    # Required, like the Linux and macOS jobs. The suite is split by test file so each
    # shard stays well under the cap; tests/e2e/README.md "CI Behavior" has the times.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'

      - name: Install dashboard test dependency
        run: python -m pip install Pillow

      - run: npm ci

      - name: Run this shard of the full suite
        shell: bash
        env:
          CCDM_PYTHON: ${{ steps.python.outputs.python-path }}
          CCDM_E2E_JOBS: 4
          # Rerun a failed file alone once, as on Linux and macOS (the runner's Windows
          # default is off). A file that then passes is printed as FLAKY.
          CCDM_E2E_NO_RERUN: "0"
          # Outside the checkout: workspaces copy every untracked file in it.
          CCDM_E2E_REPORT_DIR: ${{ runner.temp }}/e2e-report
          # Every tests/e2e/**/*.test.js, sorted by path; file i goes to shard (i mod SHARDS) + 1.
          # SHARDS must match the shard list in the matrix.
          SHARD: ${{ matrix.shard }}
          SHARDS: 2
        run: |
          mapfile -t files < <(node -e '
            const fs = require("fs");
            const path = require("path");
            const shard = Number(process.env.SHARD);
            const shards = Number(process.env.SHARDS);
            if (!(Number.isInteger(shards) && shards >= 1 && Number.isInteger(shard) && shard >= 1 && shard <= shards)) {
              throw new Error(`shard ${process.env.SHARD} of ${process.env.SHARDS} is not a shard`);
            }
            const files = fs.readdirSync(path.join("tests", "e2e"), { recursive: true })
              .map(file => `tests/e2e/${file.split(path.sep).join("/")}`)
              .filter(file => file.endsWith(".test.js"))
              .sort();
            for (const [index, file] of files.entries()) {
              if (index % shards === shard - 1) console.log(file);
            }
          ')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "shard $SHARD of $SHARDS has no test files" >&2
            exit 1
          fi
          echo "shard $SHARD of $SHARDS: ${#files[@]} test files"
          node tests/run-e2e.mjs "${files[@]}"

      # Also after a failure or the time limit, so the files that did finish can be read.
      - name: Upload the per-file report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-report-node-${{ matrix.node }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-report
          if-no-files-found: warn

  macos-e2e:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CCDM_PYTHON: /usr/bin/python3
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Put the Mac's own Python first on PATH
        run: echo /usr/bin >> "$GITHUB_PATH"

      - name: Assert Python is 3.9
        run: /usr/bin/python3 -c "import sys; assert sys.version_info[:2] == (3, 9), sys.version"

      - name: Install dashboard test dependency and vermin
        run: /usr/bin/python3 -m pip install --user Pillow vermin

      - name: Python floor check
        run: |
          "$(/usr/bin/python3 -m site --user-base)/bin/vermin" --target=3.9- --eval-annotations --violations scripts/
          /usr/bin/python3 tests/e2e/support/python_floor.py annotations scripts

      - name: Import every ccdmlib module
        run: /usr/bin/python3 tests/e2e/support/python_floor.py imports scripts

      - name: Load the Python entry points
        run: |
          /usr/bin/python3 scripts/thread-supervisor.py --help > /dev/null
          /usr/bin/python3 scripts/conversation-reminder-service.py --help > /dev/null
          /usr/bin/python3 scripts/usage-stats-poster.py --help > /dev/null
          /usr/bin/python3 -c "import runpy; runpy.run_path('scripts/resolve-codex-home.py', run_name='floor_check')"

      - run: npm ci --omit=optional

      - name: Assert native Windows packages are absent
        run: |
          for package in node_modules/koffi node_modules/node-pty node_modules/@xterm/* node_modules/@koromix/*; do
            if [ -e "$package" ]; then
              echo "$package is installed; Linux and macOS must not have it" >&2
              exit 1
            fi
          done

      - name: Install tmux for the real-tools suite
        run: brew install tmux

      - name: Verify host tools
        run: |
          command -v zsh
          command -v tmux
          command -v jq

      - run: npm test
